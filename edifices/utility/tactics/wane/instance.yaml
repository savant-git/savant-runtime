schema: "savant://utility/tactic/wane/1.0.0"

id: "utility:tactic:wane"
name: "wane"
kind: "tactic"
edifice: "utility"
status: "active"

authority_effect: "none"

specification:
  path: "canon/specifications/utility/wane.md"

purpose:
  - "transfer admitted objects inward from s3://savant-ai-cluster into the invocation directory"

runtime:
  entrypoint: "runtime/wane.py"
  provider_adapter: "runtime/adapters/aws_s3_boundary.py"

ownership:
  owns:
    - "inward transfer semantics"
    - "invocation-directory placement"
    - "download validation"
    - "download integrity verification"
    - "wane receipts"

  does_not_own:
    - "aws credentials"
    - "s3 authority"
    - "upload semantics"
    - "wax"

compatibility:
  legacy_command: "dow"

invariants:
  invocation_directory_destination: true
  implicit_download_directory: false
  foreign_bucket_access: false
  traversal: false
  atomic_promotion: true
  sha256_when_available: true
