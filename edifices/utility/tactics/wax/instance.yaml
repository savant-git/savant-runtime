schema: "savant://utility/tactic/wax/1.0.0"

id: "utility:tactic:wax"
name: "wax"
kind: "tactic"
edifice: "utility"
status: "active"

authority_effect: "none"

specification:
  path: "canon/specifications/utility/wax.md"

purpose:
  - "transfer admitted local savant-runtime files outward to the root namespace of s3://savant-ai-cluster"

runtime:
  entrypoint: "runtime/wax.py"
  provider_adapter: "runtime/adapters/aws_s3_boundary.py"

ownership:
  owns:
    - "outward transfer semantics"
    - "root object naming"
    - "upload validation"
    - "upload integrity verification"
    - "wax receipts"

  does_not_own:
    - "aws credentials"
    - "s3 authority"
    - "download semantics"
    - "wane"

compatibility:
  legacy_command: "upl"

invariants:
  root_bound_remote_keys: true
  implicit_remote_prefix: false
  runtime_root_containment: true
  symlink_traversal: false
  sensitive_upload_default: "deny"
  sha256: true
