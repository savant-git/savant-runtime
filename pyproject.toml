[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "savant-runtime"
version = "0.1.0"
description = "Filesystem canon and Palaver runtime services"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "Flask==3.1.3",
  "flask-cors==6.0.5",
  "jsonschema==4.26.0",
  "PyYAML==6.0.3",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.19,<2",
  "pip-audit>=2.10,<3",
  "ruff>=0.14,<1",
]

[tool.setuptools]
py-modules = ["palaver_voice_backend"]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["current_runtime_source_dump_*.txt", "relics", "_reports"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S603"]

