<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  />
  <title>SAVANT Niche Taskboard</title>
  <style>
    :root {
      color-scheme: dark;
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      --bg: #090b0f;
      --panel: #11151b;
      --panel-2: #171c24;
      --panel-3: #1d2430;
      --text: #f3f6fb;
      --muted: #929cad;
      --line: #28303c;
      --accent: #d5a94f;
      --accent-2: #ff3c96;
      --good: #5fd39b;
      --warn: #e5b85c;
      --bad: #ed6b75;
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(
          circle at 20% 0%,
          rgba(213, 169, 79, 0.07),
          transparent 28rem
        ),
        radial-gradient(
          circle at 100% 20%,
          rgba(255, 60, 150, 0.05),
          transparent 30rem
        ),
        var(--bg);
      color: var(--text);
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      color: inherit;
    }

    a {
      color: inherit;
    }

    .shell {
      width: min(1500px, 100%);
      margin: 0 auto;
      padding: 18px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 18px;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background:
        linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.025),
          rgba(255, 255, 255, 0.005)
        ),
        rgba(17, 21, 27, 0.94);
      backdrop-filter: blur(14px);
    }

    .identity {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .mark {
      width: 34px;
      height: 34px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 3px;
      transform: skewY(-12deg);
    }

    .mark i {
      display: block;
      border: 1px solid rgba(213, 169, 79, 0.55);
      background:
        linear-gradient(
          180deg,
          rgba(213, 169, 79, 0.28),
          rgba(255, 60, 150, 0.07)
        );
    }

    .identity small {
      display: block;
      color: var(--muted);
      font-size: 9px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .identity strong {
      display: block;
      margin-top: 2px;
      font-size: 16px;
      letter-spacing: 0.06em;
    }

    .modes {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    .mode {
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 8px 11px;
      background: rgba(255, 255, 255, 0.02);
      color: var(--muted);
      cursor: pointer;
    }

    .mode:hover,
    .mode:focus-visible {
      border-color: rgba(213, 169, 79, 0.35);
      color: var(--text);
      outline: none;
    }

    .mode.active {
      color: var(--accent);
      border-color: rgba(213, 169, 79, 0.34);
      background: rgba(213, 169, 79, 0.08);
    }

    .layout {
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
      gap: 18px;
      align-items: start;
    }

    .sidebar,
    .workspace {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(17, 21, 27, 0.91);
      overflow: hidden;
    }

    .sidebar {
      position: sticky;
      top: 18px;
    }

    .panel-head {
      padding: 14px 15px;
      border-bottom: 1px solid var(--line);
    }

    .panel-head small {
      display: block;
      color: var(--accent);
      font-size: 8px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .panel-head strong {
      display: block;
      margin-top: 4px;
      font-size: 13px;
    }

    .sidebar-content {
      padding: 12px;
    }

    .filter {
      margin-bottom: 12px;
    }

    .filter label {
      display: block;
      margin-bottom: 5px;
      color: var(--muted);
      font-size: 9px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .filter input,
    .filter select,
    .composer input,
    .composer textarea,
    .composer select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 9px 10px;
      outline: none;
      background: #0b0e13;
      color: var(--text);
    }

    .filter input:focus,
    .filter select:focus,
    .composer input:focus,
    .composer textarea:focus,
    .composer select:focus {
      border-color: rgba(213, 169, 79, 0.42);
      box-shadow:
        0 0 0 3px rgba(213, 169, 79, 0.06);
    }

    .status-list {
      display: grid;
      gap: 6px;
    }

    .status-filter {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      width: 100%;
      border: 0;
      border-radius: 8px;
      padding: 8px 9px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      text-align: left;
    }

    .status-filter:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.025);
    }

    .status-filter.active {
      color: var(--accent);
      background: rgba(213, 169, 79, 0.08);
    }

    .status-filter span:last-child {
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .workspace-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
    }

    .workspace-head h1 {
      margin: 0;
      font-size: 17px;
      letter-spacing: -0.01em;
    }

    .workspace-head p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 11px;
    }

    .primary {
      border: 1px solid rgba(213, 169, 79, 0.42);
      border-radius: 9px;
      padding: 8px 12px;
      background: var(--accent);
      color: #181208;
      font-weight: 800;
      cursor: pointer;
    }

    .primary:hover {
      filter: brightness(1.05);
    }

    .composer {
      display: none;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.015);
    }

    .composer.open {
      display: block;
    }

    .composer-grid {
      display: grid;
      grid-template-columns:
        minmax(0, 2fr)
        minmax(130px, 0.7fr)
        minmax(130px, 0.7fr);
      gap: 10px;
    }

    .composer textarea {
      min-height: 84px;
      resize: vertical;
      margin-top: 10px;
    }

    .composer-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 10px;
    }

    .secondary {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 11px;
      background: rgba(255, 255, 255, 0.02);
      color: var(--muted);
      cursor: pointer;
    }

    .board {
      padding: 14px;
    }

    .task-list {
      display: grid;
      gap: 9px;
    }

    .task {
      display: grid;
      grid-template-columns:
        minmax(0, 1fr)
        auto;
      gap: 14px;
      padding: 13px 14px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background:
        linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.02),
          rgba(255, 255, 255, 0.005)
        ),
        var(--panel-2);
    }

    .task:hover {
      border-color: rgba(213, 169, 79, 0.26);
    }

    .task-title {
      margin: 0;
      font-size: 13px;
    }

    .task-body {
      margin: 7px 0 0;
      color: #c2c9d3;
      font-size: 11px;
      line-height: 1.55;
      white-space: pre-wrap;
    }

    .task-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      padding: 3px 7px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.018);
      font-size: 9px;
    }

    .chip.good {
      color: var(--good);
      border-color: rgba(95, 211, 155, 0.22);
    }

    .chip.warn {
      color: var(--warn);
      border-color: rgba(229, 184, 92, 0.22);
    }

    .chip.bad {
      color: var(--bad);
      border-color: rgba(237, 107, 117, 0.22);
    }

    .task-actions {
      display: flex;
      align-items: flex-start;
      gap: 6px;
    }

    .task-actions button {
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 6px 8px;
      background: rgba(255, 255, 255, 0.02);
      color: var(--muted);
      cursor: pointer;
      font-size: 9px;
    }

    .task-actions button:hover {
      color: var(--text);
      border-color: var(--line-strong, #394351);
    }

    .empty {
      padding: 54px 20px;
      text-align: center;
      color: var(--muted);
    }

    .empty strong {
      display: block;
      margin-bottom: 6px;
      color: var(--text);
    }

    .footer-status {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 11px 15px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 9px;
    }

    .pulse {
      display: inline-block;
      width: 7px;
      height: 7px;
      margin-right: 6px;
      border-radius: 50%;
      background: var(--good);
      box-shadow:
        0 0 0 4px rgba(95, 211, 155, 0.08);
    }

    @media (max-width: 900px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .sidebar {
        position: static;
      }

      .sidebar-content {
        display: grid;
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .status-list {
        grid-column: 1 / -1;
        grid-template-columns:
          repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 640px) {
      .shell {
        padding: 10px;
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .modes {
        width: 100%;
      }

      .mode {
        flex: 1 1 auto;
      }

      .sidebar-content {
        display: block;
      }

      .composer-grid {
        grid-template-columns: 1fr;
      }

      .task {
        grid-template-columns: 1fr;
      }

      .task-actions {
        justify-content: flex-end;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="identity">
        <span
          class="mark"
          aria-hidden="true"
        >
          <i></i>
          <i></i>
          <i></i>
        </span>

        <div>
          <small>savant / niche</small>
          <strong>taskboard</strong>
        </div>
      </div>

      <nav
        class="modes"
        aria-label="Niche views"
      >
        <button
          class="mode active"
          data-view="tasks"
        >
          Tasks
        </button>

        <button
          class="mode"
          data-view="queue"
        >
          Queue
        </button>

        <button
          class="mode"
          data-view="history"
        >
          History
        </button>

        <button
          class="mode"
          data-view="mentor"
          id="mentorMode"
        >
          Mentor
        </button>
      </nav>
    </header>

    <div class="layout">
      <aside class="sidebar">
        <div class="panel-head">
          <small>task context</small>
          <strong>filters</strong>
        </div>

        <div class="sidebar-content">
          <div class="filter">
            <label for="search">
              Search
            </label>

            <input
              id="search"
              type="search"
              placeholder="Find tasks…"
              autocomplete="off"
            />
          </div>

          <div class="filter">
            <label for="owner">
              Owner
            </label>

            <select id="owner">
              <option value="">
                All owners
              </option>
            </select>
          </div>

          <div
            class="status-list"
            id="statusList"
          >
            <button
              class="status-filter active"
              data-status=""
            >
              <span>All</span>
              <span id="countAll">0</span>
            </button>

            <button
              class="status-filter"
              data-status="open"
            >
              <span>Open</span>
              <span id="countOpen">0</span>
            </button>

            <button
              class="status-filter"
              data-status="active"
            >
              <span>Active</span>
              <span id="countActive">0</span>
            </button>

            <button
              class="status-filter"
              data-status="blocked"
            >
              <span>Blocked</span>
              <span id="countBlocked">0</span>
            </button>

            <button
              class="status-filter"
              data-status="done"
            >
              <span>Done</span>
              <span id="countDone">0</span>
            </button>

            <button
              class="status-filter"
              data-status="paused"
            >
              <span>Paused</span>
              <span id="countPaused">0</span>
            </button>
          </div>
        </div>
      </aside>

      <main class="workspace">
        <div class="workspace-head">
          <div>
            <h1 id="viewTitle">
              Tasks
            </h1>

            <p id="viewSubtitle">
              Current Niche task projection.
            </p>
          </div>

          <button
            class="primary"
            id="newTask"
            type="button"
          >
            New task
          </button>
        </div>

        <section
          class="composer"
          id="composer"
          aria-label="Create task"
        >
          <div class="composer-grid">
            <input
              id="taskTitle"
              type="text"
              maxlength="300"
              placeholder="Task title"
            />

            <select id="taskStatus">
              <option value="open">
                Open
              </option>

              <option value="active">
                Active
              </option>

              <option value="blocked">
                Blocked
              </option>

              <option value="paused">
                Paused
              </option>

              <option value="done">
                Done
              </option>
            </select>

            <input
              id="taskOwner"
              type="text"
              maxlength="120"
              placeholder="Owner"
            />
          </div>

          <textarea
            id="taskBody"
            maxlength="12000"
            placeholder="Task context"
          ></textarea>

          <div class="composer-actions">
            <button
              class="secondary"
              id="cancelTask"
              type="button"
            >
              Cancel
            </button>

            <button
              class="primary"
              id="saveTask"
              type="button"
            >
              Create
            </button>
          </div>
        </section>

        <section class="board">
          <div
            class="task-list"
            id="taskList"
          ></div>

          <div
            class="empty"
            id="emptyState"
            hidden
          >
            <strong>No tasks match.</strong>
            <span>
              Change the current filters or create a task.
            </span>
          </div>
        </section>

        <footer class="footer-status">
          <span>
            <i
              class="pulse"
              aria-hidden="true"
            ></i>
            niche taskboard
          </span>

          <span id="runtimeStatus">
            loading
          </span>
        </footer>
      </main>
    </div>
  </div>

  <script src="/app.js"></script>

  <script>
    (() => {
      const mentor =
        document.getElementById(
          "mentorMode"
        );

      if (!mentor) {
        return;
      }

      mentor.addEventListener(
        "click",
        (event) => {
          event.preventDefault();
          event.stopImmediatePropagation();

          window.location.assign(
            "/assets/mentor/mentor.html"
          );
        },
        true
      );
    })();
  </script>
</body>
</html>
