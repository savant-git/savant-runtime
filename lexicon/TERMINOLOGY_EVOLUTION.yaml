      splyce:
        role: lexical-presentation-consumer
      scrybe:
        role: lexical-history-consumer
      pryme:
        role: lexical-authority-consumer
      cyphor:
        role: lexical-governance-owner
      thryce:
        role: lexical-validation-consumer
      spyral:
        role: lexical-evolution-consumer
      lythe:
        role: lexical-wavre-consumer
      dryve:
