schema: savant://lexicon/terminology-evolution/2.0.0
ledger_id: savant.lexicon.terminology-evolution
version: 2.0.0
authority:
  state: accepted
  source: user
  accepted_at: '2026-08-09'
  mutable_history: false
  precedence: current-user-directive
laws:
- Canonical terminology changes are appended, never erased.
- A superseded term remains historical evidence but ceases to be canonical.
- Compatibility aliases may resolve old terms to current terms.
- Compatibility aliases never make a superseded term canonical again.
- New implementation uses the current canonical term.
- Historical documents are not rewritten merely to conceal prior terminology.
- Generated wavres prefer the current canonical term.
- Filesystem presence does not establish lexical authority.
- Lexical migrations preserve lineage and provenance.
- Terminology evolution preserves every accepted lexical transition.
- A terminology change never silently destroys the identity of the concept it renames.
- Canonical terminology is governed through the Lexicon.
- The Lexicon is a Cyphor Tidal specialization.
- Historical aliases are readable but never preferred for canonical writes.
- Tidals obey the same supersession laws as every other Savant concept.
- Shard remains globally canonical.
- Mote replaces Shard only as the historical second identity-tier label.
- Kindred does not replace Lineage.
- Evidence and Attestation remain distinct concepts.
- Mutation remains Mutation.
- Convex supersedes Arc.
- Tomb supersedes Vault.
tidals:
  canonical_family:
    singular: tidal
    plural: tidals
    display: Tidals
  definition: 'Savant''s canonical family of nine reusable, shadeable, fluid, specialization-driven modular
    living elements. Each Tidal defines a distinct reusable capability domain and may be instantiated
    through a specialized centra, credenda, parameters, sidecars, visages, veneers, ruts, and wavres without
    duplicating the underlying Tidal substance.

    '
  cardinality:
    canonical_count: 9
    extensible_family: false
    extension_requires_explicit_authority: true
  members:
  - id: tidal:scyon
    term: scyon
    display: Scyon
  - id: tidal:splyce
    term: splyce
    display: Splyce
