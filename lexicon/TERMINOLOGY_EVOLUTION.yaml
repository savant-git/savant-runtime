  lexicon_binding:
    owner: tidal:cyphor
    shade: cyphor:lexicon
    centra: centra:lexical-governance
    jurisdiction:
      canonical_lexemes: true
      terminology_evolution: true
      alias_resolution: true
      supersession_resolution: true
      lexical_normalization: true
      semantic_equivalence: true
      compatibility_vocabulary: true
