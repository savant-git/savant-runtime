schema_id: schema:projection
version: 1.0.0
authority: lexicon:constitution

type: object

required:
  - registry_id
  - version
  - authority
  - projections

properties:

  registry_id:
    type: string
    pattern: "^registry:projection:[a-z][a-z0-9_-]*$"

  version:
    type: string

  authority:
    type: string

  projections:
    type: array

    items:
      type: object

      required:
        - id
        - canonical
        - description
        - status
        - source_type
        - fields
        - operations
        - output
        - dependencies
        - provenance
        - lineage

      properties:

        id:
          type: string
          pattern: "^projection:[a-z][a-z0-9_-]*(?::[a-z][a-z0-9_-]*)*$"

        canonical:
          type: string
          minLength: 1

        description:
          type: string

        status:
          type: string
          enum:
            - active
            - dormant
            - deprecated
            - superseded
            - reserved

        version:
          type: string

        authority:
          type: string

        source_type:
          type: string
          enum:
            - instance
            - segue

        conditions:
          type: array

        fields:
          type: array

          items:
            type: object

            required:
              - source
              - target

            properties:

              source:
                type: string

              target:
                type: string

              required:
                type: boolean

              default: {}

              transform:
                type: string
                enum:
                  - copy
                  - string
                  - integer
                  - float
                  - boolean
                  - lower
                  - upper
                  - sorted
                  - unique
                  - keys
                  - values
                  - length

        operations:
          type: array

          items:
            type: object

            required:
              - operation
              - target

            properties:

              operation:
                type: string
                enum:
                  - set
                  - delete
                  - copy
                  - append

              source:
                type: string

              target:
                type: string

              value: {}

        output:
          type: string
          minLength: 1

        dependencies:
          type: array
          items:
            type: string

        provenance:
          type: object

          required:
            - source
            - confidence
            - evidence

          properties:

            source:
              type: string

            confidence:
              type: string
              enum:
                - confirmed
                - inferred
                - projected

            evidence:
              type: array

        lineage:
          type: object

          required:
            - derived_from
            - history

          properties:

            derived_from:
              type: array

            supersedes:
              type: array

            history:
              type: array
