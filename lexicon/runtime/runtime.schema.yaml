schema_id: schema:runtime
version: 1.0.0
authority: lexicon:constitution

type: object

required:
  - registry_id
  - version
  - authority
  - runtime

properties:

  registry_id:
    type: string
    pattern: "^registry:runtime:[a-z][a-z0-9_-]*$"

  version:
    type: string

  authority:
    type: string

  runtime:
    type: object

    required:
      - id
      - canonical
      - description
      - status
      - version
      - authority
      - execution_order
      - subsystems
      - outputs
      - dependencies
      - provenance
      - lineage

    properties:

      id:
        type: string
        pattern: "^runtime:[a-z][a-z0-9_-]*(?::[a-z][a-z0-9_-]*)*$"

      canonical:
        type: string
        minLength: 1

      description:
        type: string

      status:
        type: string
        enum:
          - active
          - dormant
          - deprecated
          - superseded
          - reserved

      version:
        type: string

      authority:
        type: string

      execution_order:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: string

      subsystems:
        type: object

        additionalProperties:
          type: object

          required:
            - id
            - controller
            - required
            - actions

          properties:

            id:
              type: string
              pattern: "^runtime:subsystem:[a-z][a-z0-9_-]*$"

            controller:
              type: string

            required:
              type: boolean

            actions:
              type: object

              required:
                - validate
                - compile
                - integrity

              properties:

                validate:
                  type: string

                compile:
                  type: string

                integrity:
                  type: string

      outputs:
        type: object

        required:
          - root
          - manifest
          - snapshot
          - graph
          - provenance
          - lineage
          - dependencies

      dependencies:
        type: array
        items:
          type: string

      provenance:
        type: object

        required:
          - source
          - confidence
          - evidence

      lineage:
        type: object

        required:
          - derived_from
          - supersedes
          - history
