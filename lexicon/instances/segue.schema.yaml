$schema: "https://json-schema.org/draft/2020-12/schema"

title: Savant Segue Schema

type: object

required:
  - registry_id
  - version
  - segues

properties:

  registry_id:
    type: string

  version:
    type: integer
    minimum: 1

  authority:
    type: object

  segues:
    type: array

    items:
      type: object

      required:
        - id
        - canonical
        - from
        - to
        - relation
        - provenance
        - lineage

      properties:

        id:
          type: string
          pattern: "^segue:[a-z][a-z0-9_-]*(?::[a-z][a-z0-9_-]*)*$"

        canonical:
          type: string
          minLength: 1

        description:
          type: string

        status:
          type: string
          enum:
            - active
            - dormant
            - deprecated
            - superseded
            - reserved

        from:
          type: string

        to:
          type: string

        relation:
          type: string

        direction:
          type: string
          enum:
            - directed
            - bidirectional

        conditions:
          type: array
          items:
            type: object

        effects:
          type: array
          items:
            type: object

        dependencies:
          type: array
          uniqueItems: true
          items:
            type: string

        metadata:
          type: object

        provenance:
          type: object

          required:
            - source
            - confidence

          properties:

            source:
              type: string

            confidence:
              type: string
              enum:
                - confirmed
                - inferred
                - projected

            evidence:
              type: array
              items:
                type: string

        lineage:
          type: object

          required:
            - derived_from
            - history

          properties:

            derived_from:
              type: array
              items:
                type: string

            supersedes:
              type: array
              items:
                type: string

            superseded_by:
              type:
                - string
                - "null"

            history:
              type: array
              items:
                type: object

additionalProperties: true
