schema: savant://lexicon/accepted-decisions/1.3.0
decision_set_id: lexicon:accepted-decisions:20260809:02
version: 1.3.0

authority:
  state: accepted
  source: user
  accepted_at: "2026-08-09"
  immutable: true
  precedence: current-user-directive

purpose: >
  Consolidate accepted 2026-08-09 lexical decisions while preserving
  supersession, compatibility, lineage, provenance, and explicitly retained
  Savant terminology.

laws:
  - Current user lexical directives supersede earlier lexical naming decisions.
  - Every Savant-owned proper concept has one current canonical lexeme.
  - Superseded lexemes remain reserved historical evidence.
  - Historical lexical lineage is never destructively rewritten.
  - Compatibility aliases may resolve historical terms but are never canonical.
  - Canonical writes use the latest accepted lexeme.
  - Distinct concepts must not share one canonical lexeme.
  - Generic terms may remain canonical when explicitly retained by user authority.
  - Shard remains globally canonical and is not globally superseded by Mote.
  - The historical Shard-to-Mote mapping applies only to identity-tier-2.
  - Kindred does not replace Lineage.
  - Evidence and Attestation remain distinct.
  - Convex supersedes Arc only.
  - Tomb supersedes Vault only.
  - Mutation remains Mutation.

