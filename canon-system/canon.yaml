canon:
  id: savant
  title: savant dynamic canon
  version: 0.1.1
  status: active
  authority_root: authority
  projection_root: projections
  history_root: history
  schema_root: schemas
  rules:
    - authority_before_inference
    - authority_before_projection
    - store_authoritative_primitives_only
